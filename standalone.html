      --border-glow: rgba(59, 130, 246, 0.4);
      --primary-blue: #3B82F6;
      --primary-cyan: #06B6D4;
      --primary-emerald: #10B981;
    }

    * { box-sizing: border-box; }
    body {
      background-color: var(--bg-main);
      color: #F8FAFC;
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 10% 10%, rgba(59, 130, 246, 0.12) 0%, transparent 45%),

        radial-gradient(circle at 50% 50%, rgba(99, 102, 241, 0.05) 0%, transparent 60%);
      background-attachment: fixed;

    .glass-panel {
      background: var(--bg-panel);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.4);
    }

    .glass-card {
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .glass-card:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-glow);
      transform: translateY(-2px);
      box-shadow: 0 12px 24px -4px rgba(0, 0, 0, 0.45), 0 0 20px rgba(59, 130, 246, 0.2);
    }

    .gradient-heading {
      background: linear-gradient(135deg, #60A5FA 0%, #38BDF8 50%, #34D399 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .btn-gradient {
      background: linear-gradient(135deg, #2563EB 0%, #06B6D4 100%);

      font-weight: 600;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 9px 18px;
      box-shadow: 0 4px 16px rgba(37, 99, 235, 0.35);
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      cursor: pointer;
    }
    .btn-gradient:hover {
      opacity: 0.95;
      transform: translateY(-1px);
      box-shadow: 0 6px 22px rgba(37, 99, 235, 0.5);
    }

    .btn-secondary {
      background: rgba(30, 41, 59, 0.8);
      color: #E2E8F0;
      font-weight: 600;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 9px 16px;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      cursor: pointer;

    .btn-secondary:hover {
      background: rgba(51, 65, 85, 0.95);

          ),
        Layers: ({ className = 'w-4 h-4' }) => 
          h('svg', { className, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: '2', strokeLinecap: 'round', strokeLinejoin: 'round' },

            h('path', { d: 'M1 9h3' }),
            h('path', { d: 'M1 14h3' })
          ),
        MapPin: ({ className = 'w-4 h-4' }) =>
          h('svg', { className, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: '2', strokeLinecap: 'round', strokeLinejoin: 'round' },
            h('path', { d: 'M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z' }),
            h('circle', { cx: '12', cy: '10', r: '3' })
          )
      };

      // Preset Gallery of High-Quality Avatars
      const AVATAR_PRESETS = [
        'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80',
        'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150&auto=format&fit=crop&q=80',
        'https://images.unsplash.com/photo-1570295999919-56ceb5ecca61?w=150&auto=format&fit=crop&q=80',
        'https://images.unsplash.com/photo-1580489944761-15a19d654956?w=150&auto=format&fit=crop&q=80',
        'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150&auto=format&fit=crop&q=80',
        'https://images.unsplash.com/photo-1628157582853-a796fa650a6a?w=150&auto=format&fit=crop&q=80'
      ];

      function App() {
        const [currentUser, setCurrentUser] = useState(() => {
          try {
            const saved = localStorage.getItem('serverless_user');
            return saved ? JSON.parse(saved) : null;
          } catch (e) { return null; }
        });

        // Current Page: 'landing' | 'login' | 'signup' | 'dashboard'
        const [currentPage, setCurrentPage] = useState(() => {
          const savedUser = localStorage.getItem('serverless_user');
          return savedUser ? 'dashboard' : 'landing';
        });

        // Form Inputs
        const [authEmail, setAuthEmail] = useState('');
        const [authPassword, setAuthPassword] = useState('');
        const [authName, setAuthName] = useState('');
        const [dashboardTab, setDashboardTab] = useState('overview');

        // Modals
        const [isSubmitModalOpen, setIsSubmitModalOpen] = useState(false);
        const [isDlqOpen, setIsDlqOpen] = useState(false);
        const [selectedTask, setSelectedTask] = useState(null);
        const [isApiKeyCopied, setIsApiKeyCopied] = useState(false);
        const [isEditProfileOpen, setIsEditProfileOpen] = useState(false);

        // Edit Profile State
        const [editProfileName, setEditProfileName] = useState('');
        const [editProfileRole, setEditProfileRole] = useState('');
        const [editProfileAvatar, setEditProfileAvatar] = useState('');

        const [tasks, setTasks] = useState([]);
        const [logs, setLogs] = useState([]);
        const [dlq, setDlq] = useState([]);
        const [chaosMode, setChaosMode] = useState(false);
        const [activeFilter, setActiveFilter] = useState('ALL');
        const [metrics, setMetrics] = useState({
          totalSubmitted: 0,
          totalCompleted: 0,
          totalFailed: 0,
          avgLatencyMs: 140,
          latencies: [120, 150, 95, 175, 130]
        });

        const [customImageFile, setCustomImageFile] = useState(null);
        const [customImagePreview, setCustomImagePreview] = useState(null);
        const [customPdfTitle, setCustomPdfTitle] = useState('System Performance Audit');
        const [customPdfAuthor, setCustomPdfAuthor] = useState('');

        const chartRef = useRef(null);
        const chartInstance = useRef(null);

        // Synchronize edit profile when user state changes
        useEffect(() => {
          if (currentUser) {
            setEditProfileName(currentUser.name || 'Cloud Architect');
            setEditProfileRole(currentUser.role || 'Lead Cloud Engineer');
            setEditProfileAvatar(currentUser.avatar || AVATAR_PRESETS[0]);
            if (!customPdfAuthor) {
              setCustomPdfAuthor(currentUser.name || 'Cloud Architect');
            }
          }
        }, [currentUser]);

        useEffect(() => {
          handleDispatchTask({
            name: 'Infrastructure Health Audit',
            type: 'pdf_generator',
            priority: 'HIGH',
            payload: { title: 'Infrastructure Health Audit', author: currentUser ? currentUser.name : 'Cloud Engineer' }
          });

          setTimeout(() => {
            handleDispatchTask({
              name: 'Live Bitcoin & Ethereum Scraper',
              type: 'data_scraper',
              priority: 'MEDIUM',
              payload: { symbol: 'BTC', records: 1250 }
            });
          }, 350);
        }, []);

        useEffect(() => {
          if (!chartRef.current || !window.Chart || currentPage !== 'dashboard' || dashboardTab !== 'overview') return;
          if (chartInstance.current) chartInstance.current.destroy();

          const ctx = chartRef.current.getContext('2d');
          chartInstance.current = new window.Chart(ctx, {
            type: 'line',
            data: {
              labels: metrics.latencies.map((_, i) => '#' + (i + 1)),
              datasets: [{
                label: 'Worker Latency (ms)',
                data: metrics.latencies,
                borderColor: '#38BDF8',
                backgroundColor: 'rgba(56, 189, 248, 0.12)',
                fill: true,
                tension: 0.35,
                pointBackgroundColor: '#38BDF8',
                pointRadius: 4
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { display: false } },
              scales: {
                x: { grid: { color: 'rgba(255, 255, 255, 0.06)' }, ticks: { color: '#64748b' } },
                y: { grid: { color: 'rgba(255, 255, 255, 0.06)' }, ticks: { color: '#64748b' } }
              }
            }
          });
        }, [metrics.latencies, currentPage, dashboardTab]);

        const appendLog = (taskId, level, message) => {
          setLogs(prev => [
            {
              id: 'log_' + Date.now() + Math.random(),
              taskId,
              level,
              message,
              timestamp: new Date().toLocaleTimeString()
            },
            ...prev.slice(0, 100)
          ]);
        };

        // Handle Dynamic Registration & Login
        const handleAuthSubmit = (e) => {
          e.preventDefault();
          const cleanName = authName.trim() || authEmail.split('@')[0] || 'Cloud Architect';
          const user = {
            id: 'usr_' + Date.now().toString().slice(-6),
            name: cleanName,
            email: authEmail.trim() || 'user@example.com',
            role: 'Lead Cloud Architect',
            apiKey: 'flow_live_' + Array.from({length: 20}, () => Math.floor(Math.random()*16).toString(16)).join(''),
            avatar: AVATAR_PRESETS[Math.floor(Math.random() * AVATAR_PRESETS.length)]
          };
          setCurrentUser(user);
          localStorage.setItem('serverless_user', JSON.stringify(user));
          setCustomPdfAuthor(cleanName);
          setCurrentPage('dashboard');
          if (window.confetti) window.confetti({ particleCount: 70, spread: 80 });
        };

        // 1-Click Demo Login
        const handleDemoLogin = () => {
          const demoUser = {
            id: 'usr_' + Date.now().toString().slice(-6),
            name: 'Cloud Architect',
            email: 'architect@replyme.cloud',
            role: 'Lead Cloud Engineer',
            apiKey: 'flow_live_9f83a0bc4e21d5790cba1248',
            avatar: AVATAR_PRESETS[1]
          };
          setCurrentUser(demoUser);
          localStorage.setItem('serverless_user', JSON.stringify(demoUser));
          setCustomPdfAuthor('Cloud Architect');
          setCurrentPage('dashboard');
          if (window.confetti) window.confetti({ particleCount: 50, spread: 60 });
        };

        const handleSaveProfile = (e) => {
          e.preventDefault();
          if (!currentUser) return;
          const updated = {
            ...currentUser,
